name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Initialize iOS Project (if needed)
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npx tauri ios init
          fi

      - name: Configure iOS Background Audio
        run: |
          for PLIST in $(find src-tauri/gen/apple -name "Info.plist"); do
            echo "Configuring UIBackgroundModes in $PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          done
          node scripts/setup-ios.cjs

      - name: Build iOS App (Unsigned)
        run: |
          npx tauri ios build --no-sign

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Searching deeper in DerivedData / build..."
            APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_DIR" ]; then
            echo "Error: No .app bundle found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r Aura.ipa Payload/
          ls -lh Aura.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-iOS-unsigned
          path: Aura.ipa
          retention-days: 14

name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode.app 2>/dev/null | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Initialize iOS Project (if needed)
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npx tauri ios init --ci || npx tauri ios init || true
          fi

      - name: Configure iOS Background Audio & Project Format
        run: |
          for PLIST in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            echo "Configuring UIBackgroundModes in $PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          done
          node scripts/setup-ios.cjs

      - name: Build iOS App (Unsigned)
        run: |
          export CI=true
          npx tauri ios build --no-sign --target aarch64 || {
            echo "Attempting fallback direct xcodebuild..."
            cd src-tauri/gen/apple
            xcodebuild build \
              -workspace aura.xcodeproj/project.xcworkspace \
              -scheme aura_iOS \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""
            cd ../../..
          }

      - name: Package into IPA
        run: |
          mkdir -p Payload
          APP_DIR=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Searching deeper in DerivedData / build..."
            APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_DIR" ]; then
            echo "Searching in target..."
            APP_DIR=$(find src-tauri/target -name "*.app" -type d 2>/dev/null | head -n 1)
          fi
          if [ -z "$APP_DIR" ]; then
            echo "Error: No .app bundle found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r Aura-Player.ipa Payload/
          ls -lh Aura-Player.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-iOS-IPA
          path: Aura-Player.ipa
          retention-days: 14

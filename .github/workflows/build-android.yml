name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Configure Android NDK & SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "Installing NDK via sdkmanager..."
            sdkmanager --install "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          NDK_VER=$(basename "$NDK_DIR")
          echo "Using NDK at $NDK_DIR (version $NDK_VER)"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_VERSION=$NDK_VER" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          npx tauri android build --apk --target aarch64 armv7

      - name: Sign APK
        run: |
          echo "Generating keystore..."
          keytool -genkey -v -keystore release.keystore -alias aura -keyalg RSA -keysize 2048 -validity 10000 -storepass auraplayer -keypass auraplayer -dname "CN=Aura, OU=Music, O=Aura, L=City, S=State, C=US"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using build-tools at $BUILD_TOOLS_DIR"
          
          APK_FILES=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f)
          echo "Found APKs:"
          echo "$APK_FILES"
          
          # Pick release or universal apk
          MAIN_APK=$(echo "$APK_FILES" | grep -i "universal" | head -n 1)
          if [ -z "$MAIN_APK" ]; then
            MAIN_APK=$(echo "$APK_FILES" | head -n 1)
          fi
          
          if [ -z "$MAIN_APK" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          
          echo "Selected APK: $MAIN_APK"
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:auraplayer --ks-key-alias aura --key-pass pass:auraplayer --out Aura-Player.apk "$MAIN_APK"
          
          ls -lh Aura-Player.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Android-APK
          path: Aura-Player.apk
          retention-days: 14

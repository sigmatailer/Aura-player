name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Configure Android SDK & NDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Ensure target platforms and build tools are present
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
          
          # Find installed NDK or install fallback
          NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "Installing NDK via sdkmanager..."
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          NDK_VER=$(basename "$NDK_DIR")
          echo "Using NDK at $NDK_DIR (version $NDK_VER)"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_VERSION=$NDK_VER" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Build Android APK
        run: |
          chmod +x src-tauri/gen/android/gradlew || true
          npx tauri android build --apk --target aarch64 armv7 --ci

      - name: Sign APK
        run: |
          echo "Generating keystore..."
          keytool -genkey -v -keystore release.keystore -alias aura -keyalg RSA -keysize 2048 -validity 10000 -storepass auraplayer -keypass auraplayer -dname "CN=Aura, OU=Music, O=Aura, L=City, S=State, C=US"
          
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          echo "Using build-tools at $BUILD_TOOLS_DIR"
          
          APK_FILES=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f)
          echo "Found APKs:"
          echo "$APK_FILES"
          
          # Prioritize release and universal apk
          MAIN_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" -type f | grep -i "universal" | head -n 1)
          if [ -z "$MAIN_APK" ]; then
            MAIN_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" -type f | head -n 1)
          fi
          if [ -z "$MAIN_APK" ]; then
            MAIN_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          fi
          
          if [ -z "$MAIN_APK" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          
          echo "Selected APK: $MAIN_APK"
          
          # Zipalign if needed
          ALIGNED_APK="aligned-temp.apk"
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$MAIN_APK" "$ALIGNED_APK" || cp "$MAIN_APK" "$ALIGNED_APK"
          
          # Sign with apksigner
          $BUILD_TOOLS_DIR/apksigner sign --ks release.keystore --ks-pass pass:auraplayer --ks-key-alias aura --key-pass pass:auraplayer --out Aura-Player.apk "$ALIGNED_APK"
          
          # Verify signature
          $BUILD_TOOLS_DIR/apksigner verify -v Aura-Player.apk
          
          ls -lh Aura-Player.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Android-APK
          path: Aura-Player.apk
          retention-days: 14
